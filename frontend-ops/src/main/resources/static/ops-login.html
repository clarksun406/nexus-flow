<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - NexusFlow Ops Console</title>
  <style>
    :root {
      --bg: #eef1f7;
      --panel: #ffffff;
      --line: #e3e8f0;
      --text: #0b1526;
      --muted: #5b6b7e;
      --muted-2: #8b99ab;
      --brand: #4f46e5;
      --brand-2: #0ea5a4;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --red: #dc2626;
      --ring: rgba(79, 70, 229, 0.15);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(79, 70, 229, 0.14), transparent 60%),
        radial-gradient(700px 460px at 0% 100%, rgba(14, 165, 164, 0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 32px 28px;
      border: 1px solid rgba(11, 21, 38, 0.08);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 30px 60px -25px rgba(11, 21, 38, 0.25);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand), #7c6cf2 45%, var(--brand-2));
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      flex: none;
      background: linear-gradient(135deg, var(--brand) 10%, #7c6cf2 45%, var(--brand-2) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 10px 22px -8px rgba(79, 70, 229, 0.55);
    }
    h1 { margin: 0; font-size: 21px; letter-spacing: -0.01em; }
    .muted { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: var(--muted-2); }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); }
    .btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, var(--primary-dark));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 14px 26px -12px rgba(79, 70, 229, 0.65);
      transition: filter 0.15s, transform 0.05s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .error {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #f3c6c6;
      display: none;
    }
    .foot {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted-2);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .foot b { color: var(--muted); font-weight: 650; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>Ops Console</h1>
        <p class="muted">Internal operations login</p>
      </div>
    </div>
    <form id="loginForm" onsubmit="return login(event)">
      <div class="field">
        <label for="apiBase">API Base</label>
        <input id="apiBase" autocomplete="off" placeholder="http://localhost:8080" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" placeholder="ops@nexusflow.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password" />
      </div>
      <button class="btn" type="submit" id="submitBtn">Sign In</button>
      <div id="error" class="error"></div>
    </form>
    <div class="foot">
      <span>NexusFlow Platform</span>
      <b>Ops Console</b>
    </div>
  </div>

  <script>
    const CONFIG_KEY = 'nexusflow.ops.config';

    (function loadConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
        document.getElementById('apiBase').value = saved.apiBase || '';
      } catch (_) {}
    })();

    async function login(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      err.style.display = 'none';
      try {
        const apiBase = document.getElementById('apiBase').value.trim().replace(/\/$/, '');
        localStorage.setItem(CONFIG_KEY, JSON.stringify({ apiBase }));
        const res = await fetch(apiBase + '/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed');
        }
        window.location.href = 'ops.html';
      } catch (error) {
        err.textContent = error.message;
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
