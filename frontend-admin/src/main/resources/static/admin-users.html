<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management - NexusFlow Admin</title>
  <style>
    :root {
      --bg: #eef1f7;
      --panel: #ffffff;
      --line: #e3e8f0;
      --line-soft: #edf1f7;
      --text: #0b1526;
      --muted: #5b6b7e;
      --muted-2: #8b99ab;
      --brand: #4f46e5;
      --brand-2: #0ea5a4;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --green: #059669;
      --red: #dc2626;
      --ring: rgba(79, 70, 229, 0.15);
      --shadow: 0 24px 48px -20px rgba(11, 21, 38, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 88% -12%, rgba(79, 70, 229, 0.12), transparent 62%),
        radial-gradient(760px 460px at -8% 24%, rgba(14, 165, 164, 0.10), transparent 60%),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px clamp(16px, 3vw, 26px);
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand) 10%, #7c6cf2 45%, var(--brand-2) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 8px 18px -8px rgba(79, 70, 229, 0.55);
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: -0.01em; }
    .brand span { display: block; font-size: 12px; color: var(--muted); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 26px) 40px; }
    .btn {
      min-height: 40px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }
    .btn:hover { border-color: #cdd7e4; background: #f7f9fd; }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #6366f1, var(--primary-dark));
      box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.65);
    }
    .btn.primary:hover { background: linear-gradient(135deg, #5558e8, #3730a3); }
    .btn.danger { color: var(--red); border-color: #f3c6c6; }
    .btn.danger:hover { background: #fef2f2; }
    .panel {
      border: 1px solid rgba(11, 21, 38, 0.07);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 20px 22px;
      margin-top: 18px;
    }
    .panel h2 {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line-soft); }
    th {
      font-weight: 750;
      color: var(--muted-2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: #fbfcfe;
    }
    tbody tr:hover { background: #f8fafd; }
    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      background: var(--line-soft);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
    }
    .form-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: end; flex-wrap: wrap; }
    .field { display: grid; gap: 6px; flex: 1; min-width: 160px; }
    .field label {
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 8px 12px;
      color: var(--text);
      outline: none;
      font-size: 13px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: var(--muted-2); }
    input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); }
    .status {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    .status.ok { display: block; background: #ecfdf5; color: var(--green); border: 1px solid #b5e3cd; }
    .status.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #f3c6c6; }
    .loading { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <strong>NexusFlow Admin</strong>
        <span>User Management</span>
      </div>
    </div>
    <a href="index.html" class="btn">Back</a>
  </header>

  <main class="wrap">
    <div class="panel">
      <h2>Lookup User Roles</h2>
      <div class="form-row">
        <div class="field">
          <label>User ID (UUID)</label>
          <input id="userIdInput" placeholder="e.g. 00000000-0000-0000-0000-000000000001" />
        </div>
        <div class="field" style="max-width:180px">
          <label>Scope Type</label>
          <select id="scopeTypeInput">
            <option value="">All</option>
            <option value="SYSTEM">SYSTEM</option>
            <option value="MERCHANT">MERCHANT</option>
          </select>
        </div>
        <button class="btn primary" onclick="lookupRoles()">Lookup</button>
      </div>
      <div id="lookupStatus" class="status"></div>
      <div id="lookupLoading" class="loading" style="display:none">Loading...</div>
      <table id="rolesTable" style="display:none">
        <thead><tr><th>Role Code</th><th>Scope Type</th><th>Scope ID</th><th>Actions</th></tr></thead>
        <tbody id="rolesBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Grant Role to User</h2>
      <div class="form-row">
        <div class="field">
          <label>User ID (UUID)</label>
          <input id="grantUserId" placeholder="User UUID" />
        </div>
        <div class="field">
          <label>Role ID (UUID)</label>
          <input id="grantRoleId" placeholder="Role UUID" />
        </div>
        <div class="field" style="max-width:160px">
          <label>Scope Type</label>
          <select id="grantScopeType">
            <option value="MERCHANT">MERCHANT</option>
            <option value="SYSTEM">SYSTEM</option>
          </select>
        </div>
        <div class="field">
          <label>Scope ID (UUID, optional)</label>
          <input id="grantScopeId" placeholder="Merchant UUID" />
        </div>
        <button class="btn primary" onclick="grantRole()">Grant</button>
      </div>
      <div id="grantStatus" class="status"></div>
    </div>

    <div class="panel">
      <h2>Revoke Role from User</h2>
      <div class="form-row">
        <div class="field">
          <label>User ID (UUID)</label>
          <input id="revokeUserId" placeholder="User UUID" />
        </div>
        <div class="field">
          <label>Role ID (UUID)</label>
          <input id="revokeRoleId" placeholder="Role UUID" />
        </div>
        <div class="field" style="max-width:160px">
          <label>Scope Type</label>
          <select id="revokeScopeType">
            <option value="MERCHANT">MERCHANT</option>
            <option value="SYSTEM">SYSTEM</option>
          </select>
        </div>
        <div class="field">
          <label>Scope ID (UUID, optional)</label>
          <input id="revokeScopeId" placeholder="Merchant UUID" />
        </div>
        <button class="btn danger" onclick="revokeRole()">Revoke</button>
      </div>
      <div id="revokeStatus" class="status"></div>
    </div>
  </main>

  <script>
    const CONFIG_KEY = 'nexusflow.admin.config';
    const API = '/admin';
    let apiBase = '';

    (function loadConfig() {
      try {
        apiBase = (JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}').apiBase || '').replace(/\/$/, '');
      } catch (_) {}
    })();

    async function apiFetch(path, options = {}) {
      const res = await fetch(apiBase + path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (res.status === 401) {
        window.location.href = 'admin-login.html';
        throw new Error('Session expired');
      }
      return res;
    }

    async function lookupRoles() {
      const userId = document.getElementById('userIdInput').value.trim();
      const scopeType = document.getElementById('scopeTypeInput').value;
      const loading = document.getElementById('lookupLoading');
      const table = document.getElementById('rolesTable');
      const st = document.getElementById('lookupStatus');
      if (!userId) {
        st.className = 'status err';
        st.textContent = 'User ID is required';
        return;
      }
      loading.style.display = '';
      table.style.display = 'none';
      try {
        let url = API + '/users/' + userId + '/roles';
        if (scopeType) url += '?scopeType=' + scopeType;
        const res = await apiFetch(url);
        if (!res.ok) throw new Error('Failed: ' + res.status);
        const roles = await res.json();
        loading.style.display = 'none';
        table.style.display = '';
        const body = document.getElementById('rolesBody');
        body.innerHTML = '';
        if (roles.length === 0) {
          body.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">No roles found</td></tr>';
          return;
        }
        roles.forEach((role) => {
          body.innerHTML += `<tr>
            <td><code>${role.roleCode || role.roleId || '-'}</code></td>
            <td>${role.scopeType || '-'}</td>
            <td>${role.scopeId || '-'}</td>
            <td><button class="btn danger" onclick="revokeRoleDirect('${userId}','${role.roleId}','${role.scopeType || 'MERCHANT'}','${role.scopeId || ''}')">Revoke</button></td>
          </tr>`;
        });
      } catch (error) {
        loading.style.display = 'none';
        st.className = 'status err';
        st.textContent = 'Error: ' + error.message;
      }
    }

    async function grantRole() {
      const userId = document.getElementById('grantUserId').value.trim();
      const roleId = document.getElementById('grantRoleId').value.trim();
      const scopeType = document.getElementById('grantScopeType').value;
      const scopeId = document.getElementById('grantScopeId').value.trim();
      const st = document.getElementById('grantStatus');
      if (!userId || !roleId) {
        st.className = 'status err';
        st.textContent = 'User ID and Role ID are required';
        return;
      }
      try {
        const body = { userId, roleId, scopeType };
        if (scopeId) body.scopeId = scopeId;
        const res = await apiFetch(API + '/users/grant-role', {
          method: 'POST',
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text());
        st.className = 'status ok';
        st.textContent = 'Role granted successfully';
      } catch (error) {
        st.className = 'status err';
        st.textContent = 'Error: ' + error.message;
      }
    }

    async function revokeRole() {
      const userId = document.getElementById('revokeUserId').value.trim();
      const roleId = document.getElementById('revokeRoleId').value.trim();
      const scopeType = document.getElementById('revokeScopeType').value;
      const scopeId = document.getElementById('revokeScopeId').value.trim();
      const st = document.getElementById('revokeStatus');
      if (!userId || !roleId) {
        st.className = 'status err';
        st.textContent = 'User ID and Role ID are required';
        return;
      }
      await doRevoke(userId, roleId, scopeType, scopeId, st);
    }

    async function revokeRoleDirect(userId, roleId, scopeType, scopeId) {
      if (!confirm('Revoke this role?')) return;
      const st = document.getElementById('lookupStatus');
      await doRevoke(userId, roleId, scopeType, scopeId, st);
      lookupRoles();
    }

    async function doRevoke(userId, roleId, scopeType, scopeId, stEl) {
      try {
        let url = API + '/users/' + userId + '/roles/' + roleId + '?scopeType=' + scopeType;
        if (scopeId) url += '&scopeId=' + scopeId;
        const res = await apiFetch(url, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed: ' + res.status);
        stEl.className = 'status ok';
        stEl.textContent = 'Role revoked';
      } catch (error) {
        stEl.className = 'status err';
        stEl.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
