<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roles &amp; Permissions - NexusFlow Admin</title>
  <style>
    :root {
      --bg: #eef1f7;
      --panel: #ffffff;
      --line: #e3e8f0;
      --line-soft: #edf1f7;
      --text: #0b1526;
      --muted: #5b6b7e;
      --muted-2: #8b99ab;
      --brand: #4f46e5;
      --brand-2: #0ea5a4;
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-dark: #4338ca;
      --green: #059669;
      --red: #dc2626;
      --ring: rgba(79, 70, 229, 0.15);
      --shadow: 0 24px 48px -20px rgba(11, 21, 38, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 88% -12%, rgba(79, 70, 229, 0.12), transparent 62%),
        radial-gradient(760px 460px at -8% 24%, rgba(14, 165, 164, 0.10), transparent 60%),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px clamp(16px, 3vw, 26px);
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand) 10%, #7c6cf2 45%, var(--brand-2) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 8px 18px -8px rgba(79, 70, 229, 0.55);
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: -0.01em; }
    .brand span { display: block; font-size: 12px; color: var(--muted); }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 26px) 40px; }
    .btn {
      min-height: 40px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }
    .btn:hover { border-color: #cdd7e4; background: #f7f9fd; }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #6366f1, var(--primary-dark));
      box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.65);
    }
    .btn.primary:hover { background: linear-gradient(135deg, #5558e8, #3730a3); }
    .btn.danger { color: var(--red); border-color: #f3c6c6; }
    .btn.danger:hover { background: #fef2f2; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    @media (max-width: 960px) { .panels { grid-template-columns: 1fr; } }
    .panel {
      border: 1px solid rgba(11, 21, 38, 0.07);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 20px 22px;
    }
    .panel h2 {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line-soft); }
    th {
      font-weight: 750;
      color: var(--muted-2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: #fbfcfe;
    }
    tbody tr:hover { background: #f8fafd; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(79, 70, 229, 0.2);
    }
    .badge.system { background: #fff8ee; color: #92400e; border-color: #f3d9ad; }
    .badge.merchant { background: #eff6ff; color: #1e40af; border-color: #c9dcf8; }
    .form-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: end; flex-wrap: wrap; }
    .field { display: grid; gap: 6px; flex: 1; min-width: 160px; }
    .field label {
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 8px 12px;
      color: var(--text);
      outline: none;
      font-size: 13px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: var(--muted-2); }
    input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--ring); }
    .status {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    .status.ok { display: block; background: #ecfdf5; color: var(--green); border: 1px solid #b5e3cd; }
    .status.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #f3c6c6; }
    .loading { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <strong>NexusFlow Admin</strong>
        <span>Roles &amp; Permissions</span>
      </div>
    </div>
    <a href="index.html" class="btn">Back</a>
  </header>

  <main class="wrap">
    <div class="panels">
      <div class="panel">
        <h2>Roles</h2>
        <div class="form-row">
          <div class="field">
            <label>Role Code</label>
            <input id="roleCode" placeholder="e.g. MERCHANT_OWNER" />
          </div>
          <div class="field">
            <label>Name</label>
            <input id="roleName" placeholder="Display name" />
          </div>
          <button class="btn primary" onclick="createRole()">Create</button>
        </div>
        <div id="rolesStatus" class="status"></div>
        <div id="rolesLoading" class="loading">Loading roles...</div>
        <table id="rolesTable" style="display:none">
          <thead><tr><th>Code</th><th>Name</th><th>Scope</th><th>Actions</th></tr></thead>
          <tbody id="rolesBody"></tbody>
        </table>
      </div>

      <div class="panel">
        <h2>Permissions</h2>
        <div id="permsLoading" class="loading">Loading permissions...</div>
        <table id="permsTable" style="display:none">
          <thead><tr><th>Code</th><th>Name</th><th>Scope</th></tr></thead>
          <tbody id="permsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Role Permissions</h2>
      <div class="form-row">
        <div class="field">
          <label>Select Role</label>
          <select id="roleSelect" onchange="loadRolePerms()">
            <option value="">-- choose a role --</option>
          </select>
        </div>
      </div>
      <div id="rolePermsLoading" class="loading" style="display:none">Loading...</div>
      <div id="rolePermsSection" style="display:none">
        <table>
          <thead><tr><th>Permission Code</th><th>Name</th></tr></thead>
          <tbody id="rolePermsBody"></tbody>
        </table>
        <div class="form-row" style="margin-top:12px">
          <div class="field">
            <label>Add Permission</label>
            <select id="permSelect"><option value="">-- choose --</option></select>
          </div>
          <button class="btn primary" onclick="addPermToRole()">Add</button>
        </div>
      </div>
      <div id="rolePermsStatus" class="status"></div>
    </div>
  </main>

  <script>
    const CONFIG_KEY = 'nexusflow.admin.config';
    const API = '/admin';
    let allRoles = [];
    let allPerms = [];
    let apiBase = '';

    (function loadConfig() {
      try {
        apiBase = (JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}').apiBase || '').replace(/\/$/, '');
      } catch (_) {}
    })();

    async function apiFetch(path, options = {}) {
      const res = await fetch(apiBase + path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      if (res.status === 401) {
        window.location.href = 'admin-login.html';
        throw new Error('Session expired');
      }
      return res;
    }

    async function loadRoles() {
      try {
        const res = await apiFetch(API + '/roles');
        if (!res.ok) throw new Error('Failed to load roles');
        allRoles = await res.json();
        renderRoles();
      } catch (error) {
        document.getElementById('rolesLoading').textContent = 'Error: ' + error.message;
      }
    }

    function renderRoles() {
      document.getElementById('rolesLoading').style.display = 'none';
      document.getElementById('rolesTable').style.display = '';
      const body = document.getElementById('rolesBody');
      const sel = document.getElementById('roleSelect');
      body.innerHTML = '';
      sel.innerHTML = '<option value="">-- choose a role --</option>';
      allRoles.forEach((role) => {
        const scopeClass = role.scope === 'SYSTEM' ? 'system' : 'merchant';
        body.innerHTML += `<tr>
          <td><code>${role.code}</code></td>
          <td>${role.name || ''}</td>
          <td><span class="badge ${scopeClass}">${role.scope || '-'}</span></td>
          <td><button class="btn danger" onclick="deleteRole('${role.id}')">Delete</button></td>
        </tr>`;
        sel.innerHTML += `<option value="${role.id}">${role.code} - ${role.name || ''}</option>`;
      });
    }

    async function createRole() {
      const code = document.getElementById('roleCode').value.trim();
      const name = document.getElementById('roleName').value.trim();
      const st = document.getElementById('rolesStatus');
      if (!code) {
        st.className = 'status err';
        st.textContent = 'Role code is required';
        return;
      }
      try {
        const res = await apiFetch(API + '/roles', {
          method: 'POST',
          body: JSON.stringify({ code, name, scope: 'SYSTEM' })
        });
        if (!res.ok) throw new Error(await res.text());
        st.className = 'status ok';
        st.textContent = 'Role created';
        document.getElementById('roleCode').value = '';
        document.getElementById('roleName').value = '';
        loadRoles();
      } catch (error) {
        st.className = 'status err';
        st.textContent = 'Error: ' + error.message;
      }
    }

    async function deleteRole(id) {
      if (!confirm('Delete this role?')) return;
      const st = document.getElementById('rolesStatus');
      try {
        const res = await apiFetch(API + '/roles/' + id, { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
        st.className = 'status ok';
        st.textContent = 'Role deleted';
        loadRoles();
      } catch (error) {
        st.className = 'status err';
        st.textContent = 'Error: ' + error.message;
      }
    }

    async function loadPerms() {
      try {
        const res = await apiFetch(API + '/permissions');
        if (!res.ok) throw new Error('Failed to load permissions');
        allPerms = await res.json();
        renderPerms();
      } catch (error) {
        document.getElementById('permsLoading').textContent = 'Error: ' + error.message;
      }
    }

    function renderPerms() {
      document.getElementById('permsLoading').style.display = 'none';
      document.getElementById('permsTable').style.display = '';
      const body = document.getElementById('permsBody');
      const sel = document.getElementById('permSelect');
      body.innerHTML = '';
      sel.innerHTML = '<option value="">-- choose --</option>';
      allPerms.forEach((perm) => {
        const scopeClass = perm.scope === 'SYSTEM' ? 'system' : 'merchant';
        body.innerHTML += `<tr>
          <td><code>${perm.code}</code></td>
          <td>${perm.name || ''}</td>
          <td><span class="badge ${scopeClass}">${perm.scope || '-'}</span></td>
        </tr>`;
        sel.innerHTML += `<option value="${perm.code}">${perm.code}</option>`;
      });
    }

    async function loadRolePerms() {
      const roleId = document.getElementById('roleSelect').value;
      const section = document.getElementById('rolePermsSection');
      const loading = document.getElementById('rolePermsLoading');
      if (!roleId) {
        section.style.display = 'none';
        return;
      }
      loading.style.display = '';
      section.style.display = 'none';
      try {
        const res = await apiFetch(API + '/roles/' + roleId);
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        const perms = data.permissions || [];
        loading.style.display = 'none';
        section.style.display = '';
        const body = document.getElementById('rolePermsBody');
        body.innerHTML = '';
        perms.forEach((perm) => {
          body.innerHTML += `<tr><td><code>${perm.code}</code></td><td>${perm.name || ''}</td></tr>`;
        });
        if (perms.length === 0) {
          body.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">No permissions assigned</td></tr>';
        }
      } catch (error) {
        loading.textContent = 'Error: ' + error.message;
      }
    }

    async function addPermToRole() {
      const roleId = document.getElementById('roleSelect').value;
      const permCode = document.getElementById('permSelect').value;
      const st = document.getElementById('rolePermsStatus');
      if (!roleId || !permCode) {
        st.className = 'status err';
        st.textContent = 'Select both role and permission';
        return;
      }
      try {
        const res = await apiFetch(API + '/roles/' + roleId);
        const data = await res.json();
        const current = (data.permissions || []).map((perm) => perm.code);
        if (current.includes(permCode)) {
          st.className = 'status ok';
          st.textContent = 'Already assigned';
          return;
        }
        current.push(permCode);
        const setRes = await apiFetch(API + '/roles/' + roleId + '/permissions', {
          method: 'PUT',
          body: JSON.stringify({ permissionCodes: current })
        });
        if (!setRes.ok) throw new Error(await setRes.text());
        st.className = 'status ok';
        st.textContent = 'Permission added';
        loadRolePerms();
      } catch (error) {
        st.className = 'status err';
        st.textContent = 'Error: ' + error.message;
      }
    }

    loadRoles();
    loadPerms();
  </script>
</body>
</html>
